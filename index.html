<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Server Lookup Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030712;
            --bg-surface: #111827;
            --bg-surface-glass: rgba(17, 24, 39, 0.7);
            --bg-surface-hover: rgba(31, 41, 55, 0.8);
            
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-tertiary: #6b7280;
            
            --accent-1: #3b82f6;
            --accent-2: #8b5cf6;
            
            --success: #10b981;
            --success-dim: rgba(16, 185, 129, 0.1);
            --warning: #f59e0b;
            --warning-dim: rgba(245, 158, 11, 0.1);
            --danger: #ef4444;
            --danger-dim: rgba(239, 68, 68, 0.1);

            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1.5rem;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Background */
        body::before {
            content: '';
            position: fixed;
            top: -20%; left: -10%; width: 60%; height: 60%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 60%);
            filter: blur(100px); z-index: -1; pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -20%; right: -10%; width: 60%; height: 60%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 60%);
            filter: blur(100px); z-index: -1; pointer-events: none;
        }

        .container { width: 100%; max-width: 1000px; z-index: 1; }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 3rem;
        }

        .glass-panel {
            background: var(--bg-surface-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Search Section */
        .search-card {
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .search-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .search-label svg { width: 1.2rem; height: 1.2rem; }

        .search-inputs {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .input-group {
            flex: 1;
            position: relative;
            min-width: 250px;
        }
        
        .input-group.port {
            flex: 0 0 120px;
            min-width: 100px;
        }

        input {
            width: 100%;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            padding: 1rem 1.2rem;
            border-radius: var(--radius-md);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus {
            border-color: var(--accent-1);
            background: rgba(0,0,0,0.4);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 10px 20px -10px var(--accent-2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -10px var(--accent-2);
        }
        .btn-primary:active { transform: translateY(0); }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .quick-actions {
            margin-top: 1.2rem;
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .qa-label { font-size: 0.8rem; color: var(--text-tertiary); }
        .qa-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'JetBrains Mono', monospace;
        }
        .qa-btn:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        /* Error */
        .error-msg {
            background: var(--danger-dim);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--danger);
            padding: 1rem 1.5rem;
            border-radius: var(--radius-md);
            margin-bottom: 2rem;
            font-weight: 500;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Results Layout */
        #results { display: none; animation: fadeIn 0.5s ease; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .banner {
            width: 100%;
            height: 180px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: 2rem;
            position: relative;
            border: 1px solid var(--border);
        }
        .banner img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .banner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--bg-base), transparent);
        }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .metric-card {
            background: var(--bg-surface-glass);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            transition: transform 0.3s, border-color 0.3s;
        }
        .metric-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-hover);
        }

        .metric-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 0.8rem;
        }
        .metric-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 0.4rem;
        }
        .metric-sub {
            font-size: 0.85rem;
            color: var(--text-tertiary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* Status badges inside metrics */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.8rem;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .status-online { background: var(--success-dim); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        .status-offline { background: var(--danger-dim); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-online .status-dot { background: var(--success); box-shadow: 0 0 10px var(--success); animation: pulse 2s infinite; }
        .status-offline .status-dot { background: var(--danger); }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Progress Bar */
        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 1rem;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent-1);
            width: 0%;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .progress-fill.high { background: var(--warning); }
        .progress-fill.full { background: var(--danger); }

        /* Detail Sections */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        @media (max-width: 768px) { .details-grid { grid-template-columns: 1fr; } }

        .detail-card {
            background: var(--bg-surface-glass);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
        }
        .detail-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .data-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .data-row:last-child { border-bottom: none; }
        .data-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .data-value {
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.9rem;
            text-align: right;
            max-width: 60%;
            word-break: break-word;
        }
        .data-value.mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .data-value.copyable {
            cursor: pointer;
            color: var(--accent-1);
            text-decoration: underline;
            text-underline-offset: 4px;
            text-decoration-color: transparent;
            transition: text-decoration-color 0.2s;
        }
        .data-value.copyable:hover {
            text-decoration-color: var(--accent-1);
        }

        /* Tags */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .tag-pill {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            padding: 0.3rem 0.8rem;
            border-radius: 99px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Tabs */
        .tabs-container {
            background: var(--bg-surface-glass);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }
        .tabs-header {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.2);
        }
        .tab-btn {
            flex: 1;
            padding: 1.2rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border-bottom: 2px solid transparent;
        }
        .tab-btn:hover { background: rgba(255,255,255,0.02); color: var(--text-primary); }
        .tab-btn.active {
            color: var(--accent-1);
            border-bottom-color: var(--accent-1);
            background: rgba(59, 130, 246, 0.05);
        }
        .badge-count {
            background: rgba(255,255,255,0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 99px;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
        }
        .tab-btn.active .badge-count { background: var(--accent-1); color: #fff; }

        .tab-content { display: none; padding: 1.5rem; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }

        /* Tools / Filters */
        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .filter-bar input { padding: 0.8rem 1rem; font-size: 0.9rem; }
        
        .sort-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.8rem 1.2rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .sort-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }
        .sort-btn.active { background: var(--accent-1); color: white; border-color: var(--accent-1); }

        /* Lists */
        .virtual-list {
            max-height: 500px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        .virtual-list::-webkit-scrollbar { width: 6px; }
        .virtual-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 10px; }
        .virtual-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .player-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 1rem;
            margin-bottom: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            transition: background 0.2s;
            cursor: pointer;
        }
        .player-card:hover { background: rgba(255,255,255,0.04); }
        
        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .player-rank {
            color: var(--text-tertiary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            width: 30px;
        }
        .player-name {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-primary);
        }
        .player-stats {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .player-id { color: var(--text-tertiary); font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }
        .player-ping {
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-sm);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .ping-good { background: var(--success-dim); color: var(--success); }
        .ping-warn { background: var(--warning-dim); color: var(--warning); }
        .ping-bad { background: var(--danger-dim); color: var(--danger); }

        .player-ids {
            display: none;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .player-card.expanded .player-ids { display: flex; animation: fadeIn 0.3s; }

        .id-badge {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .id-badge:hover { background: rgba(255,255,255,0.1); transform: translateY(-1px); }
        .id-type { opacity: 0.7; font-weight: 600; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; text-transform: uppercase; }
        .id-val { color: var(--text-primary); }

        /* ID colors */
        .idb-steam .id-type { color: #66c0f4; }
        .idb-discord .id-type { color: #5865F2; }
        .idb-fivem .id-type { color: #F50551; }
        .idb-license .id-type { color: #10b981; }
        .idb-xbl .id-type { color: #107C10; }
        
        .resources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.5rem;
        }
        .res-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            padding: 0.6rem 1rem;
            border-radius: var(--radius-sm);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .res-item:hover { color: var(--text-primary); border-color: var(--border-hover); background: rgba(255,255,255,0.05); }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--text-primary);
            color: var(--bg-base);
            padding: 0.8rem 1.5rem;
            border-radius: 99px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .spinner {
            width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer {
            margin-top: 4rem;
            text-align: center;
            color: var(--text-tertiary);
            font-size: 0.9rem;
        }

        .empty-state {
            padding: 3rem;
            text-align: center;
            color: var(--text-tertiary);
            font-style: italic;
        }

        /* Responsive rows */
        @media (max-width: 500px) {
            .data-row { flex-direction: column; align-items: flex-start; gap: 0.3rem; }
            .data-value { text-align: left; max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="toast" id="toast">Copied to clipboard!</div>

    <div class="container">
        <h1>Server Lookup</h1>
        <p class="subtitle">Deep dive into any FiveM server.</p>

        <div class="glass-panel search-card">
            <div class="search-label">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                Server Identifier
            </div>
            <div class="search-inputs">
                <div class="input-group">
                    <input type="text" id="cfx-input" placeholder="CFX Code or URL (e.g. bokeep)" />
                </div>
                <button class="btn-primary" id="lookup-btn" onclick="doLookup()">
                    <span id="spin" class="spinner" style="display:none"></span>
                    <span id="btn-txt">Lookup</span>
                </button>
            </div>
            <div class="quick-actions">
                <span class="qa-label">Examples:</span>
                <button class="qa-btn" onclick="fillEx('bokeep')">bokeep</button>
                <button class="qa-btn" onclick="fillEx('cfx.re/join/bokeep')">cfx.re/join/bokeep</button>
            </div>
        </div>

        <div class="error-msg" id="err-box"></div>

        <div id="results">
            <div class="banner" id="banner-wrap" style="display:none">
                <img id="banner-img" src="" alt="Banner" />
            </div>

            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-title">Status</div>
                    <div class="metric-value" id="m-status">—</div>
                    <div class="metric-sub" id="m-mode">—</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Players</div>
                    <div class="metric-value" id="m-players">—</div>
                    <div class="progress-bar"><div class="progress-fill" id="pfill"></div></div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Location</div>
                    <div class="metric-value" id="m-flag" style="font-size: 2rem;">—</div>
                    <div class="metric-sub" id="m-cname">—</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Provider</div>
                    <div class="metric-value" id="m-isp" style="font-size: 1.1rem; line-height: 1.2;">—</div>
                    <div class="metric-sub" id="m-asn">—</div>
                </div>
            </div>

            <div class="details-grid">
                <div class="detail-card">
                    <div class="detail-header">
                        <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        Server Info
                    </div>
                    <div class="data-list" id="info-list">
                        <!-- Populated dynamically to hide empty rows -->
                    </div>
                </div>
                <div class="detail-card">
                    <div class="detail-header">
                        <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                        Network & Host
                    </div>
                    <div class="data-list" id="net-list">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>
            
            <div class="detail-card" style="margin-bottom: 2rem;" id="tags-card">
                <div class="detail-header">
                    <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
                    Tags
                </div>
                <div class="tags-container" id="r-tags"></div>
            </div>

            <div class="tabs-container">
                <div class="tabs-header">
                    <button class="tab-btn active" onclick="switchTab('players', event)">
                        Players <span class="badge-count" id="tc-p">0</span>
                    </button>
                    <button class="tab-btn" onclick="switchTab('resources', event)">
                        Resources <span class="badge-count" id="tc-r">0</span>
                    </button>
                </div>
                
                <div class="tab-content active" id="tab-players">
                    <div class="filter-bar">
                        <input type="text" id="psearch" placeholder="Search names, IDs..." oninput="filterPlayers()" style="flex:1" />
                        <button class="sort-btn active" id="sort-ping" onclick="setSort('ping')">Sort: Ping</button>
                        <button class="sort-btn" id="sort-id" onclick="setSort('id')">Sort: ID</button>
                    </div>
                    <div class="virtual-list" id="plist"></div>
                </div>
                
                <div class="tab-content" id="tab-resources">
                    <div class="filter-bar">
                        <input type="text" id="rsearch" placeholder="Search resources..." oninput="filterResources()" style="flex:1" />
                    </div>
                    <div class="resources-grid virtual-list" id="rgrid"></div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            FiveM Server Lookup Pro &copy; 2026
        </div>
    </div>

    <script>
        // Data and State
        const CC = { GR: "Greece", US: "United States", DE: "Germany", FR: "France", GB: "United Kingdom", NL: "Netherlands", RU: "Russia", PL: "Poland", TR: "Turkey", CA: "Canada", AU: "Australia", BR: "Brazil", SE: "Sweden", FI: "Finland", NO: "Norway", IT: "Italy", ES: "Spain", UA: "Ukraine", RO: "Romania", CZ: "Czechia", PT: "Portugal", BE: "Belgium", CH: "Switzerland", AT: "Austria", HU: "Hungary", BG: "Bulgaria", SK: "Slovakia", DK: "Denmark", ZA: "South Africa", SG: "Singapore", JP: "Japan", KR: "South Korea", IN: "India", CN: "China", MX: "Mexico", LT: "Lithuania", LV: "Latvia", EE: "Estonia", RS: "Serbia", HR: "Croatia", CY: "Cyprus", SI: "Slovenia", BA: "Bosnia", MK: "North Macedonia", AL: "Albania" };
        const PM = { pt: "Platinum", au: "Gold", ag: "Silver" };

        let allPlayers = [], allResources = [];
        let sortKey = 'ping';

        // Helpers
        const isValid = val => val && val !== '—' && val !== 'Unknown';
        const esc = s => String(s).replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
        const flag = cc => (cc && cc.length === 2) ? String.fromCodePoint(...[...cc.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) : '';
        const timeAgo = d => {
            const s = Math.floor((Date.now() - d) / 1000);
            if (s < 60) return 'just now';
            if (s < 3600) return `${Math.floor(s / 60)}m ago`;
            if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
            return `${Math.floor(s / 86400)}d ago`;
        };

        function showErr(msg) {
            const b = document.getElementById('err-box');
            b.textContent = msg; b.style.display = 'block';
        }
        
        function fillEx(code) {
            document.getElementById('cfx-input').value = code;
        }

        function setLoading(on) {
            document.getElementById('spin').style.display = on ? 'inline-block' : 'none';
            document.getElementById('btn-txt').textContent = on ? '' : 'Lookup';
            document.getElementById('lookup-btn').disabled = on;
        }

        function switchTab(name, e) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            e.currentTarget.classList.add('active');
            document.getElementById('tab-' + name).classList.add('active');
        }

        function copyToClip(text) {
            if(!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const t = document.getElementById('toast');
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 2000);
            });
        }

        // Render dynamic lists and skip empty ones ("oti exei —" fix)
        function renderDataList(containerId, items) {
            const c = document.getElementById(containerId);
            const html = items.filter(i => isValid(i.value)).map(i => `
                <div class="data-row">
                    <div class="data-label">${i.label}</div>
                    <div class="data-value ${i.mono ? 'mono' : ''} ${i.copy ? 'copyable' : ''}" ${i.copy ? `onclick="copyToClip('${esc(i.value)}')"` : ''}>
                        ${esc(i.value)}
                    </div>
                </div>
            `).join('');
            
            c.innerHTML = html.trim() ? html : '<div class="data-row"><div class="data-label">No data available</div></div>';
        }

        function parseInput(raw) {
            let val = raw.trim();
            if (/(?:\d{1,3}\.){3}\d{1,3}/.test(val)) {
                throw new Error("Direct IPs are no longer supported. Please enter a CFX code or URL (e.g. bokeep).");
            }
            let cfxCode = val;
            const m = val.match(/cfx\.re\/join\/([a-zA-Z0-9]+)/i);
            if (m) cfxCode = m[1];
            return cfxCode;
        }

        async function doLookup() {
            document.getElementById('err-box').style.display = 'none';
            document.getElementById('results').style.display = 'none';
            
            const rawCfx = document.getElementById('cfx-input').value;
            
            if (!rawCfx.trim()) { showErr('Enter a CFX code or URL'); return; }
            
            setLoading(true);
            try {
                const cfxCode = parseInput(rawCfx);
                let srv = null, resolvedIp = null, port = '30120';

                const r = await fetch(`https://frontend.cfx-services.net/api/servers/single/${cfxCode}`);
                if (r.ok) {
                    const d = await r.json(); srv = d.Data;
                    if (srv?.connectEndPoints?.length) {
                        const parts = srv.connectEndPoints[0].split(':');
                        resolvedIp = parts[0];
                        if (parts[1]) port = parts[1];
                    }
                } else {
                    throw new Error("Server not found or invalid CFX code.");
                }

                let geo = {};
                if (resolvedIp) {
                    try {
                        const r = await fetch(`https://ipwho.is/${resolvedIp}`);
                        if (r.ok) {
                            const d = await r.json();
                            if (d.success) {
                                geo = { ip: d.ip, cc: d.country_code, country: d.country, region: d.region, city: d.city, lat: d.latitude, lon: d.longitude, tz: d.timezone?.id, isp: d.connection?.isp || d.connection?.org, asn: d.connection?.asn ? 'AS' + d.connection.asn : '' };
                            }
                        }
                    } catch (e) { console.warn(e); }
                }

                populate(srv, geo, resolvedIp, cfxCode, port);
            } catch (e) {
                showErr('Lookup failed: ' + e.message);
            }
            setLoading(false);
        }

        function populate(srv, geo, resolvedIp, cfxCode, port) {
            document.getElementById('results').style.display = 'block';

            const fl = flag(geo.cc);
            const cname = CC[geo.cc] || geo.country || geo.cc || '';

            // Banner
            const bw = document.getElementById('banner-wrap');
            const bUrl = srv?.vars?.banner_detail || srv?.vars?.banner_connecting;
            if (bUrl) {
                document.getElementById('banner-img').src = bUrl;
                bw.style.display = 'block';
            } else bw.style.display = 'none';

            // Top Metrics
            const elStatus = document.getElementById('m-status');
            const elPlayers = document.getElementById('m-players');
            const elFill = document.getElementById('pfill');
            const elMode = document.getElementById('m-mode');
            
            if (srv) {
                const clients = srv.clients || 0, max = srv.sv_maxclients || srv.svMaxclients || 32;
                const pct = Math.min(100, Math.round(clients / max * 100));
                
                elStatus.innerHTML = '<span class="status-badge status-online"><div class="status-dot"></div> Online</span>';
                elMode.textContent = srv.gametype || srv.vars?.gametype || 'FiveM Server';
                elPlayers.textContent = `${clients} / ${max}`;
                
                setTimeout(() => elFill.style.width = pct + '%', 100);
                elFill.className = 'progress-fill' + (pct >= 100 ? ' full' : pct >= 75 ? ' high' : '');
            } else {
                elStatus.innerHTML = '<span class="status-badge status-offline"><div class="status-dot"></div> Offline</span>';
                elMode.textContent = 'Unreachable';
                elPlayers.textContent = '0 / 0';
                elFill.style.width = '0%';
            }

            document.getElementById('m-flag').textContent = fl || '🌐';
            document.getElementById('m-cname').textContent = cname || 'Unknown Location';
            document.getElementById('m-isp').textContent = (geo.isp || '').replace(/^AS\d+\s*/, '').substring(0, 30) || 'Unknown ISP';
            document.getElementById('m-asn').textContent = geo.asn || '';

            // Server Info - Dynamic list (hides empties)
            const v = srv?.vars || {};
            const svInfo = [
                { label: 'Name', value: (srv?.hostname || '').replace(/\^[0-9a-fA-F]/g, '').trim() },
                { label: 'Gamemode', value: v.gametype || srv?.gametype },
                { label: 'Map', value: v.mapname || srv?.mapname },
                { label: 'Build', value: v.sv_enforceGameBuild || v['sv_enforceGameBuild'], mono: true },
                { label: 'OneSync', value: v.onesync_enabled === 'true' ? 'Enabled' : (v.onesync_enabled === 'false' ? 'Disabled' : '') },
                { label: 'Locale', value: v.locale, mono: true },
                { label: 'Premium', value: PM[v.premium] || v.premium },
                { label: 'txAdmin', value: v['txAdmin-version'] ? 'v' + v['txAdmin-version'] : '' },
                { label: 'FXServer', value: srv?.server, mono: true },
                { label: 'Last Seen', value: srv?.lastSeen ? `${new Date(srv.lastSeen).toLocaleString()} (${timeAgo(new Date(srv.lastSeen))})` : '' },
                { label: 'Description', value: v.sv_projectDesc }
            ];
            renderDataList('info-list', svInfo);

            // Network Info - Dynamic list
            const ep = resolvedIp ? `${resolvedIp}:${port || '30120'}` : cfxCode;
            const netInfo = [
                { label: 'IP Address', value: geo.ip || resolvedIp, mono: true, copy: true },
                { label: 'Endpoint', value: ep, mono: true, copy: true },
                { label: 'Country', value: fl ? `${fl} ${cname}` : cname },
                { label: 'City', value: geo.city },
                { label: 'Region', value: geo.region },
                { label: 'ISP', value: (geo.isp || '').replace(/^AS\d+\s*/, '') },
                { label: 'ASN', value: geo.asn, mono: true },
                { label: 'Coordinates', value: (geo.lat && geo.lon) ? `${geo.lat}, ${geo.lon}` : '', mono: true, copy: true }
            ];
            renderDataList('net-list', netInfo);

            // Tags
            const tContainer = document.getElementById('r-tags');
            const tags = v.tags ? [...new Set(v.tags.split(',').map(t => t.trim()).filter(Boolean))] : [];
            if (tags.length) {
                tContainer.innerHTML = tags.map(t => `<span class="tag-pill">${esc(t)}</span>`).join('');
                document.getElementById('tags-card').style.display = 'block';
            } else {
                document.getElementById('tags-card').style.display = 'none';
            }

            // Players
            allPlayers = srv?.players || [];
            document.getElementById('tc-p').textContent = allPlayers.length;
            document.getElementById('psearch').value = '';
            setSort('ping'); // auto renders players

            // Resources
            allResources = srv?.resources || [];
            document.getElementById('tc-r').textContent = allResources.length;
            document.getElementById('rsearch').value = '';
            filterResources();
        }

        // Players Logic
        function setSort(k) {
            sortKey = k;
            document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('sort-' + k).classList.add('active');
            filterPlayers();
        }

        function filterPlayers() {
            const q = document.getElementById('psearch').value.toLowerCase().trim();
            let arr = q ? allPlayers.filter(p => p.name.toLowerCase().includes(q) || String(p.id).includes(q)) : [...allPlayers];
            
            const c = document.getElementById('plist');
            
            // Check if players are obfuscated by FiveM
            if (allPlayers.length > 0 && allPlayers.every(p => p.name === 'Player' && p.id === 0 && p.ping === 0)) {
                c.innerHTML = '<div class="empty-state">Player lists are hidden by FiveM for privacy and to prevent metagaming.</div>';
                return;
            }

            if (!arr.length) { c.innerHTML = '<div class="empty-state">No players found</div>'; return; }
            
            arr.sort((a, b) => {
                if (sortKey === 'ping') return a.ping - b.ping;
                return a.id - b.id;
            });

            c.innerHTML = arr.map((p, i) => `
                <div class="player-card" onclick="this.classList.toggle('expanded')">
                    <div class="player-header">
                        <div class="player-info">
                            <span class="player-rank">#${i + 1}</span>
                            <span class="player-name">${esc(p.name)}</span>
                        </div>
                        <div class="player-stats">
                            <span class="player-id">ID: ${p.id}</span>
                            <span class="player-ping ${p.ping < 80 ? 'ping-good' : p.ping < 150 ? 'ping-warn' : 'ping-bad'}">${p.ping}ms</span>
                        </div>
                    </div>
                    <div class="player-ids">
                        ${(p.identifiers || []).length ? (p.identifiers || []).map(idstr => {
                            const [type, val] = idstr.split(':');
                            const valStr = val || idstr;
                            const cls = `idb-${(type || 'other').toLowerCase()}`;
                            return `<div class="id-badge ${cls}" onclick="event.stopPropagation(); copyToClip('${esc(idstr)}')">
                                <span class="id-type">${esc(type || 'ID')}</span>
                                <span class="id-val">${esc(valStr)}</span>
                            </div>`;
                        }).join('') : '<span style="color:var(--text-tertiary);font-size:0.85rem">No identifiers</span>'}
                    </div>
                </div>
            `).join('');
        }

        function filterResources() {
            const q = document.getElementById('rsearch').value.toLowerCase().trim();
            const arr = q ? allResources.filter(r => r.toLowerCase().includes(q)) : allResources;
            const c = document.getElementById('rgrid');
            if (!arr.length) { c.innerHTML = '<div class="empty-state" style="grid-column: 1/-1">No resources found</div>'; return; }
            c.innerHTML = arr.map(r => `<div class="res-item" title="${esc(r)}">${esc(r)}</div>`).join('');
        }

        // Enter key
        document.getElementById('cfx-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLookup(); });
    </script>
</body>
</html>
